name: Build iOS App (Unsigned IPA & Simulator)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS on macOS
    runs-on: macos-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install dependencies
        run: npm install

      - name: 4. Generate native iOS project (Expo Prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: 5. Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: 6. Build iOS App for Physical Device (Unsigned .ipa)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building Workspace: $WORKSPACE | Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r -q Hello-iPhone-Unsigned.ipa Payload

      - name: 7. Upload Unsigned .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hello-iPhone-Unsigned-IPA
          path: ios/Hello-iPhone-Unsigned.ipa
          retention-days: 14
